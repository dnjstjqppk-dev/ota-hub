      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#1A6BFF"/>
      <stop offset="100%" stop-color="#0B3BE0"/>
    </linearGradient>
    <linearGradient id="gft-sym-accent" x1="36" y1="20" x2="52" y2="36" gradientUnits="userSpaceOnUse">

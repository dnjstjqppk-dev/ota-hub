name: CI/CD

# TG-06: split jobs by cost. PRs run `fast` only; pushes to main run
# fast + e2e, then deploy. workflow_dispatch allows manual E2E re-runs.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# #167 preserved per ref: a newer run on the same branch cancels the stale one,
# so a newer main never deploys under an older run (and PRs don't pile up).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    name: Fast gates (branding, unit, types, audit)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: |
          npm install
          npm --prefix frontend-user install
          cd frontend-admin && npm install
          cd .. && npm --prefix frontend-partner install

      - name: Run Brand Governance Guard
        run: npm run check:branding

      - name: Run Backend Tests
        run: |
          cd backend
          go test ./...

      - name: Run Worker & Frontend Unit Tests
        run: npm test

      - name: Typecheck worker
        run: npm run typecheck

      - name: Validate D1 migrations on a fresh local DB
        run: npx wrangler d1 migrations apply ota_local --local -c wrangler.local.jsonc

      - name: Audit dependencies (critical blocks the gate)
        run: |
          npm audit --omit=dev --audit-level=critical
          npm --prefix frontend-user audit --omit=dev --audit-level=critical
          npm --prefix frontend-admin audit --omit=dev --audit-level=critical
          npm --prefix frontend-partner audit --omit=dev --audit-level=critical

  e2e:
    runs-on: ubuntu-latest
    name: Worker E2E suite (main only)
    needs: fast
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm --prefix frontend-user install
          cd frontend-admin && npm install
          cd .. && npm --prefix frontend-partner install

      - name: Build all 3 portals for local worker assets
        run: node scripts/build-all.js

      - name: Run worker E2E suite against local wrangler dev
        run: |
          # Ephemeral CI-only secrets (never committed; .dev.vars is git-ignored).
          node -e "console.log('JWT_SECRET=ci-ephemeral-jwt-secret-0123456789abcdef\nPII_ENC_KEY=' + require('crypto').randomBytes(32).toString('base64'))" > .dev.vars
          node scripts/dev-seed.mjs 'LocalAdmin2026!x'
          npx wrangler dev -c wrangler.local.jsonc --port 8799 > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in $(seq 1 36); do
            curl -sf http://127.0.0.1:8799/api/v1/health && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8799/api/v1/health
          ADMIN_PASSWORD='LocalAdmin2026!x' npm run test:e2e
          kill $(cat /tmp/wrangler.pid) || true

  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Workers
    needs: [fast, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: |
          npm install
          npm --prefix frontend-user install
          cd frontend-admin && npm install
          cd .. && npm --prefix frontend-partner install

      - name: Build & Deploy to Cloudflare Workers
        run: node scripts/build-and-deploy.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Baked into the 3 portal builds at build time. Empty = reporters stay disabled.
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

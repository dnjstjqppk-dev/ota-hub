name: CI/CD

# TG-06: split jobs by cost. PRs run `fast` only; pushes to main run
# fast + e2e, then deploy. workflow_dispatch allows manual E2E re-runs.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# #167 preserved per ref: a newer run on the same branch cancels the stale one,
# so a newer main never deploys under an older run (and PRs don't pile up).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    name: Fast gates (branding, unit, types, audit)

    # TG-10: the Redis implementation tests need a live server (skipped otherwise).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: |
          npm install
          npm --prefix frontend-user install
          cd frontend-admin && npm install
          cd .. && npm --prefix frontend-partner install

      - name: Run Brand Governance Guard
        run: npm run check:branding

      - name: Run Backend Tests
        run: |
          cd backend
          go test ./...

      - name: Run Worker & Frontend Unit Tests
        run: npm test

      - name: Typecheck worker
        run: npm run typecheck

      # GAP-04: the 3 portals (57% of all LOC) shipped without any type gate.
      - name: Typecheck portals
        run: |
          npm --prefix frontend-user run typecheck
          npm --prefix frontend-admin run typecheck
          npm --prefix frontend-partner run typecheck

      - name: Validate D1 migrations on a fresh local DB
        run: npx wrangler d1 migrations apply ota_local --local -c wrangler.local.jsonc

      - name: Audit dependencies (critical blocks the gate)
        run: |
          npm audit --omit=dev --audit-level=critical
          npm --prefix frontend-user audit --omit=dev --audit-level=critical
          npm --prefix frontend-admin audit --omit=dev --audit-level=critical
          npm --prefix frontend-partner audit --omit=dev --audit-level=critical

  e2e:
    runs-on: ubuntu-latest
    name: Worker E2E suite (main only)
    needs: fast
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm --prefix frontend-user install
          cd frontend-admin && npm install
          cd .. && npm --prefix frontend-partner install

      - name: Build all 3 portals for local worker assets
        run: node scripts/build-all.js

      # TG-06 fix: this job runs on its own runner — the fast job's validated
      # DB does not travel here. Apply migrations before dev-seed, or the seed
      # dies with "no such table" (observed 2026-11-14).
      - name: Apply D1 migrations to the E2E database
        run: npx wrangler d1 migrations apply ota_local --local -c wrangler.local.jsonc

      - name: Run worker E2E suite against local wrangler dev
        run: |
          # Ephemeral CI-only secrets (never committed; .dev.vars is git-ignored).
          node -e "console.log('JWT_SECRET=ci-ephemeral-jwt-secret-0123456789abcdef\nPII_ENC_KEY=' + require('crypto').randomBytes(32).toString('base64'))" > .dev.vars
          node scripts/dev-seed.mjs 'LocalAdmin2026!x'
          source scripts/ci-e2e-server.sh
          ci_boot_server sandbox /tmp/wrangler.log -- -c wrangler.local.jsonc --port 8799
          ADMIN_PASSWORD='LocalAdmin2026!x' npm run test:e2e
          ci_stop_server

      # TG-17: the Stripe suite needs PAYMENT_PROVIDER=stripe + FDS on, so it
      # runs as a second pass on the same runner (the stub boots in-file).
      - name: Run Stripe E2E suite against local wrangler dev
        env:
          # Single source for both sides of the webhook HMAC: the server var
          # below and the suite's signer (STRIPE_E2E_WEBHOOK_SECRET).
          STRIPE_E2E_WEBHOOK_SECRET: whsec_ci
        run: |
          source scripts/ci-e2e-server.sh
          ci_boot_server stripe /tmp/wrangler-stripe.log -- -c wrangler.local.jsonc --port 8799 --var PAYMENT_PROVIDER:stripe --var STRIPE_SECRET_KEY:sk_test_ci --var STRIPE_API_BASE:http://127.0.0.1:18799 --var STRIPE_WEBHOOK_SECRET:$STRIPE_E2E_WEBHOOK_SECRET --var FRAUD_REVIEW:1
          ADMIN_PASSWORD='LocalAdmin2026!x' npm run test:e2e:stripe
          ci_stop_server

      # TG-18: the suppliers suite needs NDC/GDS stub vars + a short breaker
      # cooldown, so it runs as a third pass on the same runner.
      - name: Run suppliers E2E suite against local wrangler dev
        run: |
          source scripts/ci-e2e-server.sh
          ci_boot_server sandbox /tmp/wrangler-suppliers.log -- -c wrangler.local.jsonc --port 8799 --var NDC_API_BASE:http://127.0.0.1:18899 --var NDC_API_KEY:ndc_e2e --var GDS_API_BASE:http://127.0.0.1:18899 --var GDS_API_KEY:gds_e2e --var SUPPLIER_BREAKER_COOLDOWN_MS:3000
          # BASE is 8798 by default in this suite (local runs); CI serves :8799.
          BASE='http://127.0.0.1:8799' ADMIN_PASSWORD='LocalAdmin2026!x' npm run test:e2e:suppliers
          ci_stop_server

      # TG-20: the replica suite needs READ_REPLICA_URL aimed at the in-file
      # stub, so it runs as a fourth pass on the same runner.
      - name: Run replica E2E suite against local wrangler dev
        run: |
          source scripts/ci-e2e-server.sh
          ci_boot_server sandbox /tmp/wrangler-replica.log -- -c wrangler.local.jsonc --port 8799 --var READ_REPLICA_URL:http://127.0.0.1:18999 --var REPLICA_MAX_LAG_MS:1000 --var PRIMARY_REGION:ICN
          # BASE is 8798 by default in this suite (local runs); CI serves :8799.
          BASE='http://127.0.0.1:8799' ADMIN_PASSWORD='LocalAdmin2026!x' npm run test:e2e:replica
          ci_stop_server

      # GAP-06: the multi-PG suite needs Toss AND Stripe stubs, so it runs as
      # a fifth pass. The boot check reads the default (first listed) provider.
      - name: Run multi-PG E2E suite against local wrangler dev
        env:
          TOSS_E2E_WEBHOOK_SECRET: toss_e2e
          STRIPE_E2E_WEBHOOK_SECRET: whsec_multi
        run: |
          source scripts/ci-e2e-server.sh
          ci_boot_server toss /tmp/wrangler-multi.log -- -c wrangler.local.jsonc --port 8799 --var PAYMENT_PROVIDER:toss,stripe --var TOSS_SECRET_KEY:test_sk_e2e --var TOSS_API_BASE:http://127.0.0.1:18797 --var TOSS_WEBHOOK_SECRET:$TOSS_E2E_WEBHOOK_SECRET --var STRIPE_SECRET_KEY:sk_test_e2e --var STRIPE_API_BASE:http://127.0.0.1:18799 --var STRIPE_WEBHOOK_SECRET:$STRIPE_E2E_WEBHOOK_SECRET
          BASE='http://127.0.0.1:8799' ADMIN_PASSWORD='LocalAdmin2026!x' npm run test:e2e:multi
          ci_stop_server

  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Workers
    needs: [fast, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: |
          npm install
          npm --prefix frontend-user install
          cd frontend-admin && npm install
          cd .. && npm --prefix frontend-partner install

      - name: Build & Deploy to Cloudflare Workers
        run: node scripts/build-and-deploy.js
        env:
          # Code-only: triggers (routes/crons/custom domains) are synced by a
          # local full deploy when a wrangler config changes them.
          DEPLOY_CODE_ONLY: '1'
          # Custom-domain probes from GitHub runner datacenter IPs hit Cloudflare
          # zone Bot Fight Mode (403); CI still verifies all workers.dev endpoints,
          # while local full deploys verify every custom domain with HTTP 200/301/302.
          SITE_URL: ''
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Baked into the 3 portal builds at build time. Empty = reporters stay disabled.
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Release tag stamped on portal Sentry events (TG-05).
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          NUXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
